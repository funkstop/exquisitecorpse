<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drawing Section</title>
    <link href="style.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Give+You+Glory&family=Inconsolata:wght@300&family=Tsukimi+Rounded&family=Yomogi&display=swap" rel="stylesheet"/>
  </head>
  <body>
    <header>
      <a href="#" id="backLink" class="back-link">← Back to Corpse</a>
      <h1>Drawing Room</h1>
      <p class="subtitle" id="sectionLabel"></p>
    </header>

    <main>
      <div id="instructions">
        <p>1. Draw inside the canvas below.</p>
        <p>2. Connect your lines to the grey guide points at the edges.</p>
        <p>3. Click <strong>Submit</strong> when done — this saves your section and returns you to the corpse.</p>
        <p>4. Click <strong>Download</strong> to save a copy of your drawing locally.</p>
      </div>

      <div id="canvas-area"></div>

      <div id="controls">
        <button class="btn-primary" id="submit">Submit Drawing</button>
        <button class="btn-secondary" id="save">Download</button>
      </div>
    </main>

    <script type="text/javascript" src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.js"></script>
    <script src="app.js"></script>
  </body>
</html>
