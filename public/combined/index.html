<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exquisite Corpse</title>
    <link href="style.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Give+You+Glory&family=Inconsolata:wght@300&family=Tsukimi+Rounded&family=Yomogi&display=swap" rel="stylesheet"/>
  </head>
  <body>
    <header>
      <a href="/" class="back-link">← Gallery</a>
      <h1>Exquisite Corpse: <span id="cName"></span></h1>
      <p class="subtitle">Choose an available section to draw</p>
    </header>

    <main>
      <div class="sections">

        <div class="section-card" id="card-1">
          <h2>Section 1</h2>
          <img id="img-1" src="/drawingSection/Section1_temp.png" width="100%"/>
          <p class="section-meta" id="meta-1">Available</p>
          <button class="btn-section" id="section-1">Draw Section 1</button>
        </div>

        <div class="section-card" id="card-2">
          <h2>Section 2</h2>
          <img id="img-2" src="/drawingSection/Section2_temp.png" width="100%"/>
          <p class="section-meta" id="meta-2">Available</p>
          <button class="btn-section" id="section-2">Draw Section 2</button>
        </div>

        <div class="section-card" id="card-3">
          <h2>Section 3</h2>
          <img id="img-3" src="/drawingSection/Section3_temp.png" width="100%"/>
          <p class="section-meta" id="meta-3">Available</p>
          <button class="btn-section" id="section-3">Draw Section 3</button>
        </div>

      </div>
    </main>

    <script type="text/javascript" src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
